name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src

      - name: Validate dataset specs
        run: uv run python scripts/validate_spec.py

      - name: Contract replay verify
        run: make verify

      - name: Generated docs drift check
        run: |
          uv run python scripts/gen_docs_examples.py --check
          uv run python scripts/gen_readme_datasets.py --check

  spec-changes:
    name: Spec Change Summary
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed specs
        id: changed
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'src/kpubdata/specs/**/*.yaml' | sort)
          if [ -z "$CHANGED" ]; then
            echo "specs=" >> "$GITHUB_OUTPUT"
            echo "No spec files changed."
          else
            echo "specs<<EOF" >> "$GITHUB_OUTPUT"
            echo "$CHANGED" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            echo "Changed specs:"
            echo "$CHANGED"
          fi

      - name: Comment PR with changed datasets
        if: steps.changed.outputs.specs != ''
        uses: actions/github-script@v7
        with:
          script: |
            const specs = `${{ steps.changed.outputs.specs }}`;
            const datasets = specs.trim().split('\n').map(f => {
              const m = f.match(/specs\/(\w+)\/(\w+)\.yaml$/);
              return m ? `\`${m[1]}.${m[2]}\`` : f;
            });
            const body = `### Spec datasets changed in this PR\n\n${datasets.map(d => `- ${d}`).join('\n')}\n\n_Verify these datasets pass \`make verify\` before merging._`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run tests
        run: uv run pytest -ra

  build:
    name: Build Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Build sdist and wheel
        run: uv run python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  docs:
    name: Docs Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: pip install mkdocs-material pymdown-extensions

      - name: Build docs (strict)
        run: mkdocs build --strict
